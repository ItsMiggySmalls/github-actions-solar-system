name: Testing - Reusable Workflow
on: 
  workflow_call:
    inputs:
      ingress-url:
        description: Provide the Ingress URL
        required: true
        type: string

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ingress endpoint
        env:
          URL: ${{ inputs.ingress-url }}
        run: |
          curl "${URL}/live" -s -k | jq -r .status | grep -i live