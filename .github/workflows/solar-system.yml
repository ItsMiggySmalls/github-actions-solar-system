name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

permissions:
  contents: read
  packages: write

env:
       # Pass the separate variables your code is looking for
   MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
   MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        # Keep this here just in case
   MONGO_URI: "mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@supercluster.d83jj.mongodb.net/superData?retryWrites=true&w=majority"


    
jobs:
    unit-testing:
        name: Unit Testing
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
            MONGO_URI: mongodb://localhost:27017/superData
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        strategy:
          matrix:
            node-version: [18, 24]
            operating-system: [ubuntu-latest]
            exclude:
              - node-version: 18
                operating-system: macos-latest
        runs-on: ${{ matrix.operating-system }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{ matrix.node-version }}
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node-version }}
    
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules${{ hashFiles('**/package-lock.json') }}
        
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always() 
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
            retention-days: 5

    code-coverage:
        name: Code Coverage
        container:
          image: node:18
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options:
              --name mongo
        env:
            MONGO_URI: mongodb://localhost:27017/superData
            MONGO_USERNAME: non-prod-user
            MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        #- name: Setup NodeJS Version
        #  uses: actions/setup-node@v4
        #  with:
        #    node-version: 21
    
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{ runner.os }}-node-modules${{ hashFiles('**/package-lock.json') }}
            #testing cache

        - name: Install Dependencies
          run: npm install
    
        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage 
            retention-days: 5
            
    docker:
      name: Containerization
      needs: [unit-testing, code-coverage]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Dockerhub login
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: GHCR  login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Docker Build For Testing
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            tags: ${{ secrets.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Testing
          run: |
            docker images
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
              -e MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
              ${{ secrets.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:3000/live | grep live


        - name: Set lower case repository name
          run: |
                echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

        - name: Container registry push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              itsmiggysmalls/solar-system:${{ github.sha }}
              ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

    dev-deploy:
      runs-on: ubuntu-latest
      needs: docker
      environment:
        name: development
        url: https://${{ steps.set-ingress-host.outputs.APP_INGRESS_URL }}
      outputs:
        app-ingress-url: ${{ steps.set-ingress-host.outputs.APP_INGRESS_URL }}
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Set lower case repository name
          run: |
            echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

        - name: Install Kubernetes Cluster
          uses: helm/kind-action@v1

        - name: Create Namespace & Secrets
          run: |
            kubectl create namespace development || true
            kubectl -n development create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }}
            kubectl -n development create secret generic mongo-db-creds \
              --from-literal=MONGO_URI='${{ env.MONGO_URI }}' \
              --from-literal=MONGO_USERNAME='${{ env.MONGO_USERNAME }}' \
              --from-literal=MONGO_PASSWORD='${{ env.MONGO_PASSWORD }}'

        - name: Replace Tokens in Manifests
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '{_'
            tokenSuffix: '_}'
            files: kubernetes/development/*.yaml
          env:
            NAMESPACE: development
            REPLICAS: "2"
            IMAGE: ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            INGRESS_IP: 127.0.0.1

        - name: Verify updated manifests
          run: |
            cat kubernetes/development/*.yaml

        - name: Deploy to KinD
          run: |
            kubectl apply -n development -f kubernetes/development/
            kubectl -n development rollout status deployment/solar-system --timeout=120s

        - name: Set Ingress Host Output
          id: set-ingress-host
          run: |
            HOST=$(kubectl -n development get ingress solar-system -o jsonpath='{.spec.rules[0].host}')
            echo "Found Ingress Host: $HOST"
            echo "APP_INGRESS_URL=$HOST" >> "$GITHUB_OUTPUT"

        - name: In-Cluster Integration Test
          run: |
            kubectl -n development port-forward svc/solar-system 3000:3000 &
            sleep 3
            curl --fail http://127.0.0.1:3000/live

        - name: Check Pod and Deployment Status on Failure
          if: always()
          run: |
            kubectl -n development get pods -o wide
            kubectl -n development describe pods -l app=solar-system
            kubectl -n development logs -l app=solar-system --all-containers=true --tail=50 || true

    dev-integration-testing:
      name: Integration Testing
      needs: dev-deploy
      runs-on: ubuntu-latest
      steps:
        - name: Echo Target URL from Dev-Deploy
          run: |
            echo "Testing deployed application endpoint: ${{ needs.dev-deploy.outputs.app-ingress-url }}"


    prod-deploy:
      runs-on: ubuntu-latest
      needs: dev-integration-testing
      environment:
        name: production
        url: https://${{ steps.set-ingress-host.outputs.APP_INGRESS_URL }}
      outputs:
        app-ingress-url: ${{ steps.set-ingress-host.outputs.APP_INGRESS_URL }}
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v4

        - name: Set lower case repository name
          run: |
            echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

        - name: Install Kubernetes Cluster
          uses: helm/kind-action@v1

        - name: Create Namespace & Secrets
          run: |
            kubectl create namespace production || true
            kubectl -n production create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }}
            kubectl -n production create secret generic mongo-db-creds \
              --from-literal=MONGO_URI='${{ env.MONGO_URI }}' \
              --from-literal=MONGO_USERNAME='${{ env.MONGO_USERNAME }}' \
              --from-literal=MONGO_PASSWORD='${{ env.MONGO_PASSWORD }}'

        - name: Replace Tokens in Manifests
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '{_'
            tokenSuffix: '_}'
            files: kubernetes/production/*.yaml
          env:
            NAMESPACE: development
            REPLICAS: "2"
            IMAGE: ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            INGRESS_IP: 127.0.0.1

        - name: Verify updated manifests
          run: |
            cat kubernetes/development/*.yaml

        - name: Deploy to KinD
          run: |
            kubectl apply -n development -f kubernetes/development/
            kubectl -n development rollout status deployment/solar-system --timeout=120s

        - name: Set Ingress Host Output
          id: set-ingress-host
          run: |
            HOST=$(kubectl -n development get ingress solar-system -o jsonpath='{.spec.rules[0].host}')
            echo "Found Ingress Host: $HOST"
            echo "APP_INGRESS_URL=$HOST" >> "$GITHUB_OUTPUT"

        - name: In-Cluster Integration Test
          run: |
            kubectl -n development port-forward svc/solar-system 3000:3000 &
            sleep 3
            curl --fail http://127.0.0.1:3000/live

        - name: Check Pod and Deployment Status on Failure
          if: always()
          run: |
            kubectl -n development get pods -o wide
            kubectl -n development describe pods -l app=solar-system
            kubectl -n development logs -l app=solar-system --all-containers=true --tail=50 || true

    prod-integration-testing:
      name: Prod Integration Testing
      needs: prod-deploy
      environment:
        name: production
      runs-on: ubuntu-latest
      steps:
        - name: Echo Target URL from Dev-Deploy
          run: |
            echo "Testing deployed application endpoint: ${{ needs.prod-deploy.outputs.app-ingress-url }}"